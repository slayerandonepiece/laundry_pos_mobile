<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;font-family:'DM Sans',system-ui,sans-serif;color:#102039;-webkit-font-smoothing:antialiased}
    a{color:#0758d6;text-decoration:none} a:hover{color:#064bbb}
    h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.04em;margin:0;line-height:1.2;font-weight:800}
    /* white app surface throughout; hierarchy comes from borders, not fills */
    .scr{width:390px;height:844px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .safe{height:59px;flex-shrink:0}
    .hdr{background:#fff;border-bottom:1px solid #e8ecf1;padding:6px 20px 18px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
    .appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
    .bdy{flex:1;overflow:hidden;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff}
    .card{background:#fff;border:1px solid #e8ecf1;border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(16,32,57,.05)}
    /* recessed block for hints and grouped fields — the only non-white surface */
    .inset{background:#f7f9fc;border:1px solid #e8ecf1;border-radius:11px;padding:13px 14px}
    .nav{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;display:flex;gap:4px;padding:10px 10px 26px}
    .nav>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;justify-content:center;color:#5c6878;font-size:11px;font-weight:600}
    .nav>div.on{color:#0758d6}
    .num{font-family:'Manrope',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:800}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:9px;background:#0758d6;color:#fff;font-weight:700;font-size:15px}
    .btn.sec{background:#fff;border:1px solid #dce2e9;color:#102039}
    .btn.dis{background:#dbe2ec;color:#5a6578}
    .fld{min-height:50px;border:1px solid #dce2e9;background:#fff;border-radius:9px;padding:13px 14px;display:flex;align-items:center;gap:10px;font-size:15px;color:#102039}
    .fld.err{border-color:#e8918a;background:#fffafa}
    .lbl{font-size:11.5px;font-weight:700;color:#5c6878;letter-spacing:.02em}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;white-space:nowrap}
    .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid #dce2e9;background:#fff;color:#5c6878;white-space:nowrap}
    .chip.on{background:#0758d6;border-color:#0758d6;color:#fff}
    .row{display:flex;align-items:center;gap:10px}
    .sep{height:1px;background:#eef1f6}
    .mark{display:grid;place-items:center;border-radius:12px;background:#0758d6;color:#fff;flex-shrink:0}
    .errbox{display:flex;align-items:flex-start;gap:10px;background:#fef2f1;border:1px solid #f5c6c1;border-radius:11px;padding:13px 14px}
    .errtxt{font-size:13px;font-weight:600;color:#b42318;line-height:1.45}
    .hint{font-size:12px;color:#5c6878;line-height:1.55}
    .scrim{position:absolute;inset:0;background:#061b3a;opacity:.42}
    .dlgwrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
    .dlg{position:relative;width:100%;background:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 44px rgba(6,27,58,.28)}
    .dlgopt{display:flex;align-items:center;gap:13px;border:1px solid #dce2e9;background:#fff;border-radius:11px;padding:0 15px;min-height:54px}
    .dlgopt.on{border:1.5px solid #0758d6;background:#f5f9ff}
    .foot{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;padding:16px 20px 30px;display:flex;flex-direction:column;gap:12px}
  </style>
</helmet>
<div class="scr">
  <div class="safe"></div>
  <div class="hdr">
    <div class="appbar">
      <div class="row">
        <div class="mark" style="width:38px;height:38px;font-family:Manrope;font-size:13px;font-weight:800">CH</div>
        <div>
          <div class="row" style="gap:6px">
            <span style="font-weight:700;font-size:14.5px;line-height:1.25">Chinnappanahalli</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5c6878" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.5l6.5 6 6.5-6"/></svg>
          </div>
          <div style="font-size:11.5px;color:#5c6878;margin-top:2px">Priya N. &middot; Owner</div>
        </div>
      </div>
      <div style="width:40px;height:40px;border-radius:10px;border:1px solid #dce2e9;display:grid;place-items:center;flex-shrink:0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5c6878" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </div>
    </div>
  </div>
  <div class="bdy" style="gap:10px">
    <h1 style="font-size:22px;margin-bottom:2px">More</h1>
    <div class="lbl">STORE</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 9.5h9M7.5 14h5"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Services</span>
        <span style="font-size:12.5px;color:#5c6878">9</span>
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-9l8-6 8 6v9a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><path d="M9.5 20.5v-6h5v6"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Expenses</span>
        <span class="pill" style="background:#fffdf5;color:#92400e;border:1px solid #f3d488">3 unpaid</span>
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.2 19.5a6 6 0 0111.6 0"/><path d="M16.5 6.2a3.2 3.2 0 010 5.6M18.6 19.5a5.6 5.6 0 00-2-3.4"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Staff</span>
        <span style="font-size:12.5px;color:#5c6878">3</span>
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.4"/><path d="M2.5 10h19"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Payment methods</span>
        <span style="font-size:12.5px;color:#5c6878">Cash, UPI</span>
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5h15v10a1 1 0 01-1 1h-13a1 1 0 01-1-1z"/><path d="M3.2 9.5L4.8 4.2h14.4l1.6 5.3a2.8 2.8 0 01-5.6 0 2.8 2.8 0 01-5.6 0 2.8 2.8 0 01-5.6 0z"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Store profile</span>
        
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
    </div>
    <div class="lbl" style="margin-top:8px">ACCOUNT</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#5c6878" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0114.4 0"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Your details</span>
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#5c6878" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.4" width="15" height="9.4" rx="2.2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 017.6 0v2.8"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600">Change password</span>
        
        <svg width="18" height="18" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#667388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
      </div>
      <div class="sep"></div>
      <div class="row" style="padding:15px;gap:13px;min-height:56px">
        <svg width="21" height="21" style="flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="#b42318" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 16.5v2a1.8 1.8 0 01-1.8 1.8H5.8A1.8 1.8 0 014 18.5v-13a1.8 1.8 0 011.8-1.8h7.4A1.8 1.8 0 0115 5.5v2"/><path d="M19.5 12H9.5M16.5 8.5l3.5 3.5-3.5 3.5"/></svg>
        <span style="flex:1;font-size:14.5px;font-weight:600;color:#b42318">Sign out</span>
      </div>
    </div>
    <div style="margin-top:auto;text-align:center;font-size:11px;color:#667388;padding-bottom:4px">Version 1.0 &middot; Chinnappanahalli</div>
  </div>
  <div class="nav">
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg><span>Dashboard</span></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg><span>New Sale</span></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3h13v18l-2.6-1.6L13.4 21 11 19.4 8.6 21 6 19.4 5.5 21z"/><path d="M9 8.4h6M9 12.4h6"/></svg><span>Orders</span></div>
    <div class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
