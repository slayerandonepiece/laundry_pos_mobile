<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;font-family:'DM Sans',system-ui,sans-serif;color:#102039;-webkit-font-smoothing:antialiased}
    a{color:#0758d6;text-decoration:none} a:hover{color:#064bbb}
    h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.04em;margin:0;line-height:1.2;font-weight:800}
    /* white app surface throughout; hierarchy comes from borders, not fills */
    .scr{width:390px;height:844px;background:#f7f9fc;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .safe{height:59px;flex-shrink:0}
    .hdr{background:#fff;border-bottom:1px solid #e8ecf1;padding:6px 20px 18px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
    .appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
    .bdy{flex:1;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;gap:13px}
    .card{background:#fff;border:1px solid #edf1f6;border-radius:16px;padding:16px;box-shadow:0 2px 6px rgba(16,32,57,.05)}
    /* recessed block for hints and grouped fields — the only non-white surface */
    .inset{background:#f7f9fc;border:1px solid #e8ecf1;border-radius:11px;padding:13px 14px}
    .nav{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;display:flex;gap:4px;padding:10px 10px 26px}
    .nav>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;justify-content:center;color:#5c6878;font-size:11px;font-weight:600}
    .nav>div.on{color:#0758d6}
    .num{font-family:'Manrope',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:800}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:9px;background:#0758d6;color:#fff;font-weight:700;font-size:15px}
    .btn.sec{background:#fff;border:1px solid #dce2e9;color:#102039}
    .btn.dis{background:#dbe2ec;color:#5a6578}
    .fld{min-height:50px;border:1px solid #dce2e9;background:#fff;border-radius:9px;padding:13px 14px;display:flex;align-items:center;gap:10px;font-size:15px;color:#102039}
    .fld.err{border-color:#e8918a;background:#fffafa}
    .lbl{font-size:11.5px;font-weight:700;color:#5c6878;letter-spacing:.02em}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;white-space:nowrap}
    .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid #dce2e9;background:#fff;color:#5c6878;white-space:nowrap}
    .chip.on{background:#0758d6;border-color:#0758d6;color:#fff}
    .row{display:flex;align-items:center;gap:10px}
    .sep{height:1px;background:#eef1f6}
    .mark{display:grid;place-items:center;border-radius:12px;background:#0758d6;color:#fff;flex-shrink:0}
    .errbox{display:flex;align-items:flex-start;gap:10px;background:#fef2f1;border:1px solid #f5c6c1;border-radius:11px;padding:13px 14px}
    .errtxt{font-size:13px;font-weight:600;color:#b42318;line-height:1.45}
    .hint{font-size:12px;color:#5c6878;line-height:1.55}
    .scrim{position:absolute;inset:0;background:#061b3a;opacity:.42}
    .dlgwrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
    .dlg{position:relative;width:100%;background:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 44px rgba(6,27,58,.28)}
    .dlgopt{display:flex;align-items:center;gap:13px;border:1px solid #dce2e9;background:#fff;border-radius:11px;padding:0 15px;min-height:54px}
    .dlgopt.on{border:1.5px solid #0758d6;background:#f5f9ff}
    /* v2: tinted type tile — replaces StayFlow's photo thumbnail, which laundry has no use for */
    .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
    /* v2: urgency section header, so the list groups itself instead of relying on filters */
    .sechead{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
    .sechead>span:first-child{font-size:11px;font-weight:800;letter-spacing:.12em}
    .seeall{font-size:12px;font-weight:700;color:#0758d6;display:inline-flex;align-items:center;min-height:44px;padding:0 8px;margin:-11px -8px}
    /* v2: four figures in one card instead of four cards */
    .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
    .statcell{padding:14px 16px}
    .statcell .num{display:block;font-size:25px;margin-top:6px}
    .statcell span{font-size:11.5px;color:#5c6878;font-weight:600}
    .ovstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
    .ovcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px}
    .ovcell .num{font-size:19px}
    .ovcell small{font-size:10.5px;color:#5c6878;text-align:center;line-height:1.3}
    .foot{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;padding:16px 20px 30px;display:flex;flex-direction:column;gap:12px}
  </style>
</helmet>
<div class="scr">
  <div class="scrim"></div>
  <div class="dlgwrap">
    <div class="dlg">
      <div>
        <h2 style="font-size:20px">Collect payment</h2>
        <p class="hint" style="margin:8px 0 0">EL-248 &middot; Vikram Shetty</p>
      </div>
      <div style="background:#fef2f1;border:1px solid #f5c6c1;border-radius:14px;padding:17px;text-align:center">
        <div style="font-size:11.5px;font-weight:700;color:#b42318">AMOUNT DUE</div>
        <div class="num" style="font-size:34px;color:#b42318;margin-top:6px">&#8377;680</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="dlgopt on" style="min-height:58px">
          <div class="tile" style="width:38px;height:38px;border-radius:11px;background:#eaf1ff">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.4"/><circle cx="12" cy="12" r="2.6"/></svg>
          </div>
          <span style="flex:1;font-size:15px;font-weight:700;color:#0758d6">Cash</span>
          <div style="width:22px;height:22px;border-radius:50%;background:#0758d6;display:grid;place-items:center;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        </div>
        <div class="dlgopt" style="min-height:58px">
          <div class="tile" style="width:38px;height:38px;border-radius:11px;background:#f0ebfd">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6d4bc7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.8" width="16" height="18.4" rx="2.6"/><path d="M10 18.4h4"/></svg>
          </div>
          <span style="flex:1;font-size:15px;font-weight:600">UPI</span>
          <div style="width:22px;height:22px;border-radius:50%;border:2px solid #c8d2e0;flex-shrink:0"></div>
        </div>
      </div>
      <div class="row" style="gap:10px;background:#f7f9fc;border:1px solid #e8ecf1;border-radius:11px;padding:12px 13px;align-items:flex-start">
        <svg width="17" height="17" style="flex-shrink:0;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="#0f6e4c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></svg>
        <span style="font-size:12px;color:#5c6878;line-height:1.5">Marks the order <strong style="color:#102039">delivered</strong> and creates the invoice.</span>
      </div>
      <div class="row" style="gap:10px">
        <div class="btn sec" style="flex:1;min-height:48px">Cancel</div>
        <div class="btn" style="flex:1;min-height:48px">Done</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
