<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;font-family:'DM Sans',system-ui,sans-serif;color:#102039;-webkit-font-smoothing:antialiased}
    a{color:#0758d6;text-decoration:none} a:hover{color:#064bbb}
    h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.04em;margin:0;line-height:1.2;font-weight:800}
    /* white app surface throughout; hierarchy comes from borders, not fills */
    .scr{width:390px;height:844px;background:#f7f9fc;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .safe{height:59px;flex-shrink:0}
    .hdr{background:#fff;border-bottom:1px solid #e8ecf1;padding:6px 20px 18px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
    .appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
    .bdy{flex:1;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;gap:13px}
    .card{background:#fff;border:1px solid #edf1f6;border-radius:16px;padding:16px;box-shadow:0 2px 6px rgba(16,32,57,.05)}
    /* recessed block for hints and grouped fields — the only non-white surface */
    .inset{background:#f7f9fc;border:1px solid #e8ecf1;border-radius:11px;padding:13px 14px}
    .nav{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;display:flex;gap:4px;padding:10px 10px 26px}
    .nav>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;justify-content:center;color:#5c6878;font-size:11px;font-weight:600}
    .nav>div.on{color:#0758d6}
    .num{font-family:'Manrope',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:800}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:9px;background:#0758d6;color:#fff;font-weight:700;font-size:15px}
    .btn.sec{background:#fff;border:1px solid #dce2e9;color:#102039}
    .btn.dis{background:#dbe2ec;color:#5a6578}
    .fld{min-height:50px;border:1px solid #dce2e9;background:#fff;border-radius:9px;padding:13px 14px;display:flex;align-items:center;gap:10px;font-size:15px;color:#102039}
    .fld.err{border-color:#e8918a;background:#fffafa}
    .lbl{font-size:11.5px;font-weight:700;color:#5c6878;letter-spacing:.02em}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;white-space:nowrap}
    .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid #dce2e9;background:#fff;color:#5c6878;white-space:nowrap}
    .chip.on{background:#0758d6;border-color:#0758d6;color:#fff}
    .row{display:flex;align-items:center;gap:10px}
    .sep{height:1px;background:#eef1f6}
    .mark{display:grid;place-items:center;border-radius:12px;background:#0758d6;color:#fff;flex-shrink:0}
    .errbox{display:flex;align-items:flex-start;gap:10px;background:#fef2f1;border:1px solid #f5c6c1;border-radius:11px;padding:13px 14px}
    .errtxt{font-size:13px;font-weight:600;color:#b42318;line-height:1.45}
    .hint{font-size:12px;color:#5c6878;line-height:1.55}
    .scrim{position:absolute;inset:0;background:#061b3a;opacity:.42}
    .dlgwrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
    .dlg{position:relative;width:100%;background:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 44px rgba(6,27,58,.28)}
    .dlgopt{display:flex;align-items:center;gap:13px;border:1px solid #dce2e9;background:#fff;border-radius:11px;padding:0 15px;min-height:54px}
    .dlgopt.on{border:1.5px solid #0758d6;background:#f5f9ff}
    /* v2: tinted type tile — replaces StayFlow's photo thumbnail, which laundry has no use for */
    .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
    /* v2: urgency section header, so the list groups itself instead of relying on filters */
    .sechead{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
    .sechead>span:first-child{font-size:11px;font-weight:800;letter-spacing:.12em}
    .seeall{font-size:12px;font-weight:700;color:#0758d6;display:inline-flex;align-items:center;min-height:44px;padding:0 8px;margin:-11px -8px}
    /* v2: four figures in one card instead of four cards */
    .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
    .statcell{padding:14px 16px}
    .statcell .num{display:block;font-size:25px;margin-top:6px}
    .statcell span{font-size:11.5px;color:#5c6878;font-weight:600}
    .ovstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
    .ovcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px}
    .ovcell .num{font-size:19px}
    .ovcell small{font-size:10.5px;color:#5c6878;text-align:center;line-height:1.3}
    .foot{flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;padding:16px 20px 30px;display:flex;flex-direction:column;gap:12px}
  </style>
</helmet>
<div class="scr">
  <div class="safe"></div>
  <div class="hdr">
    <div class="appbar">
      <div>
        <div style="font-size:20px;font-weight:800;font-family:Manrope,sans-serif;letter-spacing:-.04em">New sale</div>
        <div style="font-size:11.5px;color:#5c6878;margin-top:3px">6 services available</div>
      </div>
      <div style="width:40px;height:40px;border-radius:11px;border:1px solid #dce2e9;background:#fff;display:grid;place-items:center;flex-shrink:0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5c6878" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </div>
    </div>
    <div class="row" style="gap:8px">
      <span class="chip on">All</span>
      <span class="chip" style="gap:7px"><span style="width:9px;height:9px;border-radius:3px;background:#0758d6"></span>Wash</span>
      <span class="chip" style="gap:7px"><span style="width:9px;height:9px;border-radius:3px;background:#6d4bc7"></span>Dry clean</span>
      <span class="chip" style="gap:7px"><span style="width:9px;height:9px;border-radius:3px;background:#92400e"></span>Iron</span>
    </div>
  </div>
  <div class="bdy" style="gap:10px">
    <div style="background:#f5f9ff;border:1.5px solid #0758d6;border-radius:16px;padding:13px 14px;box-shadow:0 2px 6px rgba(16,32,57,.05)">
      <div class="row" style="gap:13px">
        <div class="tile" style="background:#eaf1ff">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5h15v17h-15z"/><circle cx="12" cy="13" r="4.2"/><path d="M8 7h2"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">Wash &amp; fold</div>
          <div class="num" style="font-size:12px;color:#5c6878;margin-top:3px">&#8377;100 / kg</div>
          <div class="row" style="gap:5px;margin-top:6px"><span class="num" style="font-size:13px;color:#0758d6">&#8377;420</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4-11 11H5.5v-4z"/></svg><span style="font-size:11px;color:#0758d6;font-weight:600">Edit</span></div>
        </div>
        <div style="min-width:100px;min-height:44px;border:1.5px solid #0758d6;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;box-shadow:0 0 0 3px rgba(7,88,214,.13)"><span class="num" style="font-size:16px">4.2</span><span style="font-size:12px;color:#5c6878;font-weight:600">kg</span></div>
      </div>
    </div>
    <div style="background:#f5f9ff;border:1.5px solid #0758d6;border-radius:16px;padding:13px 14px;box-shadow:0 2px 6px rgba(16,32,57,.05)">
      <div class="row" style="gap:13px">
        <div class="tile" style="background:#f0ebfd">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6d4bc7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a2 2 0 00-2 2c0 .9.6 1.6 1.4 1.9L5 12.2A1.8 1.8 0 006 15.5h12a1.8 1.8 0 001-3.3l-6.4-4.8c.8-.3 1.4-1 1.4-1.9a2 2 0 00-2-2z"/><path d="M7 19h10"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">Shirt dry clean</div>
          <div class="num" style="font-size:12px;color:#5c6878;margin-top:3px">&#8377;130 each</div>
          <div class="row" style="gap:5px;margin-top:6px"><span class="num" style="font-size:13px;color:#0758d6">&#8377;260</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4-11 11H5.5v-4z"/></svg><span style="font-size:11px;color:#0758d6;font-weight:600">Edit</span></div>
        </div>
        <div class="row" style="gap:0;flex-shrink:0;border:1.5px solid #0758d6;border-radius:11px;overflow:hidden;background:#fff"><div style="width:36px;min-height:44px;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0758d6" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></div><div class="num" style="min-width:28px;text-align:center;font-size:16px">2</div><div style="width:36px;min-height:44px;display:grid;place-items:center;background:#0758d6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></div></div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #edf1f6;border-radius:16px;padding:13px 14px;box-shadow:0 2px 6px rgba(16,32,57,.05)">
      <div class="row" style="gap:13px">
        <div class="tile" style="background:#fef3c7">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5v-2.8a5.2 5.2 0 015.2-5.2h6.8l4 8z"/><path d="M3.5 18.5h16"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">Steam iron</div>
          <div class="num" style="font-size:12px;color:#5c6878;margin-top:3px">Up to 3kg &#8377;240 &middot; +&#8377;70/kg</div>
          
        </div>
        <div style="min-width:72px;min-height:44px;border-radius:11px;border:1.5px solid #0758d6;color:#0758d6;font-size:13.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0">Add</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #edf1f6;border-radius:16px;padding:13px 14px;box-shadow:0 2px 6px rgba(16,32,57,.05)">
      <div class="row" style="gap:13px">
        <div class="tile" style="background:#f0ebfd">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6d4bc7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a2 2 0 00-2 2c0 .9.6 1.6 1.4 1.9L5 12.2A1.8 1.8 0 006 15.5h12a1.8 1.8 0 001-3.3l-6.4-4.8c.8-.3 1.4-1 1.4-1.9a2 2 0 00-2-2z"/><path d="M7 19h10"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">Trouser dry clean</div>
          <div class="num" style="font-size:12px;color:#5c6878;margin-top:3px">&#8377;160 each</div>
          
        </div>
        <div style="min-width:72px;min-height:44px;border-radius:11px;border:1.5px solid #0758d6;color:#0758d6;font-size:13.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0">Add</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #edf1f6;border-radius:16px;padding:13px 14px;box-shadow:0 2px 6px rgba(16,32,57,.05)">
      <div class="row" style="gap:13px">
        <div class="tile" style="background:#fef3c7">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5v-2.8a5.2 5.2 0 015.2-5.2h6.8l4 8z"/><path d="M3.5 18.5h16"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">Saree roll press</div>
          <div class="num" style="font-size:12px;color:#5c6878;margin-top:3px">&#8377;150 each</div>
          
        </div>
        <div style="min-width:72px;min-height:44px;border-radius:11px;border:1.5px solid #0758d6;color:#0758d6;font-size:13.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0">Add</div>
      </div>
    </div>
  </div>
  <div style="flex-shrink:0;background:#fff;border-top:1px solid #e8ecf1;padding:14px 20px;display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:9px">
        <div style="min-width:24px;height:24px;border-radius:8px;background:#0758d6;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:Manrope,sans-serif">2</div>
        <span style="font-size:13px;color:#5c6878;font-weight:600">services added</span>
      </div>
      <div class="row" style="gap:14px">
        <span style="display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin:-11px -10px;font-size:13px;font-weight:700;color:#b42318">Clear</span>
        <span class="num" style="font-size:20px">&#8377;680</span>
      </div>
    </div>
    <div class="btn">Continue to checkout
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></svg>
    </div>
  </div>
  <div class="nav">
    <div class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg><span>New Sale</span></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3h13v18l-2.6-1.6L13.4 21 11 19.4 8.6 21 6 19.4 5.5 21z"/><path d="M9 8.4h6M9 12.4h6"/></svg><span>Orders</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
